      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };

      for (let i = 0; i < N; i++) {
        const arm = i % 4;
        const u = Math.pow(rnd(), 0.82);
        const r = (0.10 + u * 0.84) * GALAXY_R;
        const theta = (arm * Math.PI) / 2 + Math.log(1.0 + r * 0.142) * 2.72 + (rnd() - 0.5) * 0.28;
        pos[i * 3]     = Math.cos(theta) * r;
        pos[i * 3 + 1] = (rnd() - 0.5) * 2.0;
        pos[i * 3 + 2] = Math.sin(theta) * r;
        const c = gasPal[arm].clone().multiplyScalar(0.24 + rnd() * 0.18);
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        sz[i] = 22 + rnd() * 34;
        rad[i] = r;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("aColor", new THREE.BufferAttribute(col, 3));
      geo.setAttribute("aSize", new THREE.BufferAttribute(sz, 1));
      geo.setAttribute("aRad", new THREE.BufferAttribute(rad, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: galaxyUniforms,
        vertexShader: /* glsl */ `
          attribute vec3 aColor; attribute float aSize; attribute float aRad;
          uniform float uTime; uniform float uDpr;
          varying vec3 vColor;
          void main(){
            vColor = aColor;
            float w = uTime * (0.04 + 0.08 / (1.0 + aRad * 0.055));
            float cw = cos(w), sw = sin(w);
            vec3 p = vec3(position.x * cw - position.z * sw, position.y, position.x * sw + position.z * cw);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = clamp(aSize * uDpr * (200.0 / max(32.0, -mv.z)), 4.0, 72.0);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uAlpha;
          varying vec3 vColor;
          void main(){
            float d = length(gl_PointCoord * 2.0 - 1.0);
            if (d >= 1.0) discard;
            float f = max(1.0 - d, 0.0001);
            float g = f * f * sqrt(f) * 0.44;
            gl_FragColor = vec4(clamp(vColor * g * uAlpha, 0.0, 2.0), clamp(g * uAlpha, 0.0, 1.0));
          }
        `,
      });
      galaxyGroup.add(new THREE.Points(geo, mat));
    })();

    // 4) Incandescent Galactic Core Glow + 14 Distant Hubble Ultra Deep Field Companion Galaxies
    const galCoreSprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: whiteSpikeTex, color: 0xffe4b8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    galCoreSprite.scale.set(56, 40, 1);
    galaxyGroup.add(galCoreSprite);

    const deepFieldGalaxies = [];
    (() => {
      let s = 13579;
      const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
      const tints = ["#ffd6a5", "#a5f3fc", "#ddd6fe", "#fde68a", "#93c5fd"];
      for (let i = 0; i < 14; i++) {
        const sp = new THREE.Sprite(
          new THREE.SpriteMaterial({ map: softGlowTex, color: new THREE.Color(tints[i % tints.length]), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })
        );
        const th = rnd() * Math.PI * 2;
        const r = 260 + rnd() * 240;
        sp.position.set(Math.cos(th) * r, (rnd() - 0.5) * 180, Math.sin(th) * r - 120);
        const w = 10 + rnd() * 18;
        sp.scale.set(w, w * (0.35 + rnd() * 0.45), 1);
        galaxyGroup.add(sp);
        deepFieldGalaxies.push(sp);
      }
    })();

    function smoothstepJS(e0, e1, x) {
      const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    /* =========================================================================
       6. INTERACTIVE TELESCOPE CAMERA (LOG-SPACE ZOOM + POINTER DRAG INERTIA)
       ========================================================================= */
    const camState = {
      dist: 8.4,
      elev: 0.14,
      yawOffset: 0,
      pitchOffset: 0,
      velX: 0,
      velY: 0,
      dragging: false,
      lastX: 0,
      lastY: 0,
    };

    canvas.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      camState.dragging = true;
      camState.lastX = e.clientX; camState.lastY = e.clientY;
      camState.velX = 0; camState.velY = 0;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!camState.dragging) return;
      const dx = e.clientX - camState.lastX, dy = e.clientY - camState.lastY;
      camState.lastX = e.clientX; camState.lastY = e.clientY;
      camState.yawOffset += dx * 0.0045;
      camState.pitchOffset = Math.max(-0.55, Math.min(0.65, camState.pitchOffset + dy * 0.0035));
      camState.velX = dx * 0.04; camState.velY = dy * 0.03;
    });
    const endDrag = () => { camState.dragging = false; };
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);
    canvas.addEventListener("dblclick", () => { camState.yawOffset = 0; camState.pitchOffset = 0; });

    function getTargetCamera(stage) {
      if (stage >= 8) return { dist: 256, elev: 0.56 };
      if (stage === 7) return { dist: 112, elev: 0.34 };
      if (stage === 6) return { dist: 42,  elev: 0.36 };
      return { dist: 8.4, elev: 0.14 };
    }

    /* =========================================================================
       7. PROGRESSIVE CONNECTION LOGIC (ZERO ALLOCATION!) & ESTADIOS 0..8
       ========================================================================= */
    function stopDrip() { if (app.dripTimer) { clearInterval(app.dripTimer); app.dripTimer = null; } }

    function resetAllArcs() {
      for (let i = 0; i < ALL_ARCS.length; i++) {
        const a = ALL_ARCS[i];
        a.active = false; a.grow = 0; a.landed = false;
        a.mesh.visible = false;
        a.mat.uniforms.uGrow.value = 0;
      }
    }

    function connectNextNode() {
      const next = NODES_DATA.find((n) => !n.active);
      if (!next) return false;
      next.active = true;
      next.pulse = 1.0;
      nodeObjs[next.idx].grp.visible = true;
      app.connectedCount++;
      app.seatCounts[next.seat]++;
      if (app.stage === 0) app.stage = 1;

      for (let i = 0; i < ALL_ARCS.length; i++) {
        const a = ALL_ARCS[i];
        if (!a.active && a.bp.to === next.idx && (a.bp.from === -1 || NODES_DATA[a.bp.from].active)) {
          a.active = true; a.grow = 0; a.landed = false;
          a.mesh.visible = true;
          a.mat.uniforms.uGrow.value = 0;
        }
      }
      app.targetWeave = Math.max(app.targetWeave, 0.09 + (app.connectedCount / 10) * 0.56);
      const tile = document.querySelector(`[data-seat="${next.seat}"]`);
      if (tile) { tile.classList.add("pulse"); setTimeout(() => tile.classList.remove("pulse"), 240); }
      syncUI();
      return true;
    }

    function startProgressiveConnect(targetCount = 10, intervalMs = 340) {
      stopDrip();
      if (app.connectedCount < targetCount) connectNextNode();
      app.dripTimer = setInterval(() => {
        if (app.connectedCount >= targetCount) { stopDrip(); return; }
        connectNextNode();
      }, intervalMs);
    }

    function ensureAllConnected() {
      stopDrip();
      while (app.connectedCount < 10) connectNextNode();
    }

    function triggerBreach() {
      if (app.connectedCount < 4) startProgressiveConnect(6, 180);
      app.breachFlash = 1.0;
      if (app.stage <= 2) { app.stage = 2; app.targetWeave = Math.max(app.targetWeave, 0.48); }
      burst3D(new THREE.Vector3(0, 0, PLANET_R * 1.1), "#f43f5e", 55, 3.2);
      app.springVel += 0.34;
      syncUI();
    }

    function triggerVeto() {
      if (app.stage < 4) setStage(4);
      app.vetoFlash = 1.0;
      waveT2 = 0.01;
      app.springVel += 0.40;
      burst3D(new THREE.Vector3(0, PLANET_R * 0.8, 0), "#a855f7", 65, 3.6);
      syncUI();
    }

    function setStage(st) {
      stopDrip();
      const prevStage = app.stage;
      app.stage = Math.max(0, Math.min(8, st));
      if (prevStage !== app.stage) {
        camState.yawOffset *= 0.35;
        camState.pitchOffset *= 0.35;
      }

      if (app.stage === 0) {
        app.targetWeave = 0.0; app.connectedCount = 0;
        app.seatCounts = { andes_a: 0, andes_b: 0, rural_a: 0, rural_b: 0, comite: 0 };
        NODES_DATA.forEach((n, i) => { n.active = false; n.pulse = 0; nodeObjs[i].grp.visible = false; });
        resetAllArcs();
        app.rulesSealed = false; app.converged = false; app.sealed = false; app.qrCollapsed = false;
      } else if (app.stage === 1) {
        app.rulesSealed = false; app.converged = false; app.sealed = false;
        startProgressiveConnect(6, 360);
      } else if (app.stage === 2) {
        app.rulesSealed = false; app.converged = false; app.sealed = false;
        triggerBreach(); return;
      } else if (app.stage === 3) {
        startProgressiveConnect(8, 240);
        app.rulesSealed = true; app.converged = false; app.sealed = false; app.qrCollapsed = true; app.targetWeave = 0.72; app.springVel += 0.30;
        burst3D(new THREE.Vector3(0, 0.3, 0), "#f59e0b", 48, 2.8);
      } else if (app.stage === 4) {
        startProgressiveConnect(10, 220);
        app.rulesSealed = true; app.converged = true; app.sealed = false; app.qrCollapsed = true; app.targetWeave = 0.88; app.springVel += 0.32;
        burst3D(new THREE.Vector3(0, 0.7, 0), "#a855f7", 55, 3.0);
      } else if (app.stage === 5) {
        ensureAllConnected();
        app.rulesSealed = true; app.converged = true; app.sealed = true; app.qrCollapsed = true;
        app.targetWeave = 1.0; waveT1 = 0.01; app.springVel += 0.52;
        setTimeout(() => { waveT2 = 0.01; }, 220);
        burst3D(new THREE.Vector3(0, 0, 0), "#10b981", 60, 4.2);
        burst3D(new THREE.Vector3(0, 0, 0), "#f59e0b", 38, 3.6);
        burst3D(new THREE.Vector3(0, 0, 0), "#a855f7", 38, 3.6);
      } else if (app.stage === 6) {
        ensureAllConnected();
        app.rulesSealed = true; app.converged = true; app.sealed = true; app.qrCollapsed = true; app.targetWeave = 1.0;
        burst3D(new THREE.Vector3(0, 0, 0), "#38bdf8", 65, 6.2);
      } else if (app.stage === 7) {
        ensureAllConnected();
        app.rulesSealed = true; app.converged = true; app.sealed = true; app.qrCollapsed = true; app.targetWeave = 1.0;
        burst3D(new THREE.Vector3(0, 0, 0), "#c084fc", 75, 13.0);
      } else if (app.stage === 8) {
        ensureAllConnected();
        app.rulesSealed = true; app.converged = true; app.sealed = true; app.qrCollapsed = true; app.targetWeave = 1.0;
        burst3D(new THREE.Vector3(0, 0, 0), "#7dd3fc", 80, 22.0);
      }
      syncUI(true);
    }

    function clearAutoAll() {
      if (app.autoTimer?.timers) app.autoTimer.timers.forEach(clearTimeout);
      app.autoTimer = null;
      document.getElementById("btnAuto").textContent = "[A] Auto-Demo";
    }

    function toggleAuto() {
      if (app.autoTimer) { clearAutoAll(); return; }
      setStage(0);
      document.getElementById("btnAuto").textContent = "[A] Pausar";
      const timeline = [
        [950,   () => setStage(1)],
        [4000,  () => setStage(2)],
        [6200,  () => setStage(3)],
        [8500,  () => setStage(4)],
        [11000, () => setStage(5)],
        [14200, () => setStage(6)],
        [17800, () => setStage(7)],
        [21400, () => { setStage(8); clearAutoAll(); }],
      ];
      app.autoTimer = { timers: timeline.map(([ms, fn]) => setTimeout(fn, ms)) };
    }

    /* =========================================================================
       8. LIVE SSE CONNECTOR + CONFIG + UI SYNC
       ========================================================================= */
    function connectSSE(url) {
      if (app.sse) { app.sse.close(); app.sse = null; }
      const tag = document.getElementById("sseTag");
      if (!url) { tag.textContent = "NGC 253 · TRACK MULTIPLAYER"; return; }
      try {
        const es = new EventSource(url);
        app.sse = es; tag.textContent = "SSE…";
        es.onopen = () => { tag.textContent = "EN VIVO · SSE ✓"; };
        es.onerror = () => { tag.textContent = "SIMULADOR (SIN CORS)"; };
        es.onmessage = (ev) => {
          try {
            const room = JSON.parse(ev.data);
            const n = (room.connectedPlayers || []).length;
            while (app.connectedCount < Math.min(10, n)) connectNextNode();
            if (room.orgs?.some((o) => o.authorityRule?.sealedThreshold !== null) && !app.rulesSealed) setStage(3);
            if (room.allocation?.status === "PROPOSED" && !app.converged) setStage(4);
            if (room.allocation?.status === "SEALED" && !app.sealed) setStage(5);
            if ((room.auditLog || []).at(-1)?.type === "RBAC_DENIED") triggerBreach();
          } catch {}
        };
      } catch { tag.textContent = "NGC 253 · TRACK MULTIPLAYER"; }
    }

    function applyConfig() {
      const base = (cfg.baseUrl || "https://team-30-platanus-hack.onrender.com").trim().replace(/\/+$/, "");
      const qrUrl = `${base}/room/demo-cross?orgId=comite_red&roleId=role_c`;
      document.title = `${cfg.brand} — Deep-Field Telescope · Galaxia`;
      document.getElementById("brandLabel").textContent = cfg.brand;
      document.getElementById("inBrand").value = cfg.brand;
      document.getElementById("inBaseUrl").value = base;
      document.getElementById("inSseUrl").value = cfg.sseUrl || "";
      try { document.getElementById("qrMount").innerHTML = MiniQR.toSvg(qrUrl, "#020910"); } catch {}
      syncUI();
    }

    function syncUI(animateHeadline = false) {
      const meta = getStageMeta(app.stage);
      const pct = Math.round(app.targetWeave * 100);
      const isGal = app.stage === 8;

      const dot = document.getElementById("topDot");
      dot.className = "live-dot" + (isGal ? " galaxy" : app.sealed ? " calm" : meta.tone === "bleed" ? " bleed" : "");
      document.getElementById("scopeMeta").textContent = meta.scope;

      const nc = document.getElementById("nodesCount");
      const np = document.getElementById("netPct");
      const nl = document.getElementById("nodesLbl");
      const pl = document.getElementById("pctLbl");

      if (app.stage === 6) {
        nc.textContent = "7"; nl.textContent = "Planetas";
        np.textContent = "1"; pl.textContent = "Sistema";
      } else if (app.stage === 7) {
        nc.textContent = "8"; nl.textContent = "Sistemas";
        np.textContent = "24+"; pl.textContent = "Orgs";
      } else if (isGal) {
        nc.textContent = "∞"; nl.textContent = "Orgs";
        np.textContent = "100%"; pl.textContent = "Galaxia";
      } else {

        np.textContent = `${pct}%`; pl.textContent = "Tejido";
      }
      np.className = "counter-num" + (isGal ? " galaxy" : app.sealed ? " calm" : "");
      nc.className = "counter-num" + (isGal ? " galaxy" : "");

      const hEl = document.getElementById("stageHeadline");
      if (hEl.textContent !== meta.h) {
        hEl.textContent = meta.h;
        hEl.className = "stage-headline" + (meta.tone ? " " + meta.tone : "");
        if (animateHeadline && !reducedMotion && meta.tone !== "galaxy") {
          void hEl.offsetWidth;
          hEl.classList.add("swap");
        }
      } else {
        hEl.className = "stage-headline" + (meta.tone ? " " + meta.tone : "");
      }
      document.getElementById("stageSubline").textContent = meta.s;
      document.getElementById("qrDock").classList.toggle("collapsed", app.qrCollapsed);

      const strip = document.getElementById("impactStrip");
      strip.classList.toggle("visible", app.stage >= 5);
      const p1 = document.getElementById("imp1"), p2 = document.getElementById("imp2"), p3 = document.getElementById("imp3");
      if (isGal) {
        p1.textContent = `ECOSISTEMA ${cfg.brand.toUpperCase()}`; p1.className = "impact-pill liquid-glass galaxy";
        p2.textContent = "UN ESQUELETO · TODAS LAS INDUSTRIAS"; p2.className = "impact-pill liquid-glass galaxy";
        p3.textContent = "MULTIPLAYER POR DISEÑO"; p3.className = "impact-pill liquid-glass galaxy";
      } else if (app.stage === 7) {
        p1.textContent = "SISTEMAS INTERCONECTADOS"; p1.className = "impact-pill liquid-glass solar";
        p2.textContent = "PRIVACIDAD ENTRE ORGANIZACIONES"; p2.className = "impact-pill liquid-glass solar";
        p3.textContent = "ESCALA EXPONENCIAL"; p3.className = "impact-pill liquid-glass solar";
      } else if (app.stage === 6) {
        p1.textContent = "UN SOLO ESQUELETO"; p1.className = "impact-pill liquid-glass solar";
        p2.textContent = "ADAPTABLE A CADA PLANETA"; p2.className = "impact-pill liquid-glass solar";
        p3.textContent = "DE LOCAL A GLOBAL"; p3.className = "impact-pill liquid-glass solar";
      } else {
        p1.textContent = "10/10 ROLES EN VIVO"; p1.className = "impact-pill liquid-glass";
        p2.textContent = "0 SECRETOS FILTRADOS"; p2.className = "impact-pill liquid-glass";
        p3.textContent = "12% → 89% CONFIABILIDAD"; p3.className = "impact-pill liquid-glass";
      }

      document.getElementById("roleLegend").innerHTML = SEATS.map((s) => {
        const c = app.seatCounts[s.id];
        return `
          <div class="role-tile liquid-glass ${c > 0 ? "active" : ""}" data-seat="${s.id}" style="--rc:${s.color};">
            <div style="display:flex;align-items:center;gap:9px;min-width:0;">
              <span class="role-dot-lg"></span>
              <span class="role-label-big">${s.name}</span>
            </div>
            <span class="role-num">${c}/2</span>
          </div>`;
      }).join("");
    }

    /* =========================================================================
       9. MAIN LOCKED-60FPS RENDER LOOP
       ========================================================================= */
    const projV = new THREE.Vector3();
    function positionTag(el, worldPos, yOffsetPx, opacity) {
      if (opacity < 0.04) { el.style.opacity = "0"; return; }
      projV.copy(worldPos).project(camera);
      if (projV.z > 1 || projV.z < -1) { el.style.opacity = "0"; return; }
      const x = (projV.x * 0.5 + 0.5) * W;
      const y = (-projV.y * 0.5 + 0.5) * H + yOffsetPx;
      if (y < H * 0.17 || y > H * 0.77 || x < 48 || x > W - 48) { el.style.opacity = "0"; return; }
      el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -50%)`;
      el.style.opacity = opacity.toFixed(2);
    }

    let prevNow = performance.now();
    let elapsed = 0;
    let perfFrames = 0, perfAccum = 0, measuredFps = 60;

    function animate(now) {
      const rawDt = (now - prevNow) / 1000;
      const dt = Math.min(Math.max(rawDt, 0.001), 0.05);
      prevNow = now;
      if (!reducedMotion) elapsed += dt;

      perfFrames++;
      perfAccum += rawDt;
      if (perfAccum >= 0.5) {
        measuredFps = Math.round(perfFrames / perfAccum);
        perfFrames = 0; perfAccum = 0;
      }

      // Single unified rAF drives ambient Milky Way video opacity (zero at Stage 0 & pure deep-space Stage 8!)
      if (nebulaVideo && !reducedMotion) {
        if (videoFadeDir !== 0) {
          videoFadeVal = Math.max(0, Math.min(1, videoFadeVal + videoFadeDir * dt * 1.8));
          if (videoFadeVal <= 0 || videoFadeVal >= 1) videoFadeDir = 0;
        }
        const stageAllow = smoothstepJS(0.08, 0.35, app.weave) * (1 - smoothstepJS(0.15, 0.65, app.galaxyBlend));
        videoOpacityCap = 0.085 * stageAllow;
        nebulaVideo.style.opacity = (videoFadeVal * videoOpacityCap).toFixed(3);
      }

      app.weave += (app.targetWeave - app.weave) * Math.min(1, dt * 2.8);
      app.climaxBloom += ((app.sealed ? 1 : 0) - app.climaxBloom) * Math.min(1, dt * 2.0);
      app.solarBlend   += ((app.stage >= 6 ? 1 : 0) - app.solarBlend)   * Math.min(1, dt * 1.9);
      app.clusterBlend += ((app.stage >= 7 ? 1 : 0) - app.clusterBlend) * Math.min(1, dt * 1.7);
      app.galaxyBlend  += ((app.stage >= 8 ? 1 : 0) - app.galaxyBlend)  * Math.min(1, dt * 1.45);

      app.springVel += (-68 * app.springPos - 8.5 * app.springVel) * dt;
      app.springPos += app.springVel * dt;
      app.rotBoost *= Math.pow(0.18, dt);

      if (app.breachFlash > 0) app.breachFlash = Math.max(0, app.breachFlash - dt * 1.0);
      if (app.vetoFlash > 0) app.vetoFlash = Math.max(0, app.vetoFlash - dt * 0.85);

      bloomPass.strength = 0.44 + app.climaxBloom * 0.07 + app.solarBlend * 0.08 + app.galaxyBlend * 0.14;

      const tgt = getTargetCamera(app.stage);
      const camLerp = 1 - Math.exp(-dt * 2.4);
      camState.dist = Math.exp(Math.log(camState.dist) + (Math.log(tgt.dist) - Math.log(camState.dist)) * camLerp);
      camState.elev += (tgt.elev - camState.elev) * camLerp;

      if (!camState.dragging) {
        camState.yawOffset += camState.velX * dt;
        camState.pitchOffset = Math.max(-0.55, Math.min(0.65, camState.pitchOffset + camState.velY * dt));
        const damp = Math.exp(-3.8 * dt);
        camState.velX *= damp; camState.velY *= damp;
      }

      const autoYaw = reducedMotion ? 0 : Math.sin(elapsed * 0.11) * 0.16 + (app.stage >= 7 ? elapsed * 0.04 : 0);
      const yaw = autoYaw + camState.yawOffset;
      const elev = Math.max(-0.35, Math.min(1.22, camState.elev + camState.pitchOffset));
      const lookY = -0.32 * (1 - app.solarBlend);
      camera.position.set(
        Math.sin(yaw) * Math.cos(elev) * camState.dist,
        lookY + Math.sin(elev) * camState.dist,
        Math.cos(yaw) * Math.cos(elev) * camState.dist
      );
      camera.lookAt(0, lookY, 0);

      // Slow parallax drift on baked skybox
      if (!reducedMotion) skyDome.rotation.y = elapsed * 0.005;
      skyMat.uniforms.uGalaxy.value = app.galaxyBlend;
      skyMat.uniforms.uClimax.value = app.climaxBloom;
      starfieldMat.uniforms.uTime.value = elapsed;

      // Scale 1: Ultra-HD First World
      const worldScale = (1 + app.springPos * 0.065) * (1 - app.galaxyBlend * 0.65);
      worldGroup.scale.setScalar(Math.max(0.15, worldScale));
      worldGroup.visible = app.galaxyBlend < 0.94;
      if (!reducedMotion) {
        worldGroup.rotation.y += dt * ((app.weave < 0.04 ? 0.05 : app.sealed ? 0.11 : 0.15) + app.rotBoost);
      }

      planetMat.uniforms.uTime.value = elapsed;
      planetMat.uniforms.uWeave.value = app.weave;
      planetMat.uniforms.uClimax.value = app.climaxBloom;
      planetMat.uniforms.uSolar.value = app.solarBlend;
      cloudMat.uniforms.uTime.value = elapsed;
      cloudMat.uniforms.uWeave.value = app.weave;
      atmoMat.uniforms.uWeave.value = app.weave;
      atmoMat.uniforms.uClimax.value = app.climaxBloom;

      const sPulse = app.weave < 0.08 ? 1.15 + Math.sin(elapsed * 3.8) * 0.22 : 0.70;
      southBeacon.scale.set(sPulse, sPulse, 1);
      southBeacon.material.opacity = Math.max(0.05, 1 - app.solarBlend * 0.85);
      sonarRings.forEach((sr) => {
        const ph = (elapsed * 0.55 + sr.offset) % 1;
        sr.mesh.visible = app.weave < 0.14;
        const sc = 0.6 + ph * 6.5;
        sr.mesh.scale.set(sc, sc, 1);
        sr.mesh.material.opacity = (1 - ph) * 0.52;
      });

      const netAlpha = Math.max(0, 1 - app.solarBlend * 0.75);
      for (let i = 0; i < ALL_ARCS.length; i++) {
        const a = ALL_ARCS[i];
        if (!a.active) continue;
        if (a.grow < 1) {
          a.grow = Math.min(1, a.grow + dt * 1.9);
          if (a.grow >= 1 && !a.landed) {
            a.landed = true;
            if (a.toIdx >= 0) {
              NODES_DATA[a.toIdx].pulse = 1.0;
              app.springVel += 0.22;
              app.rotBoost = Math.min(0.75, app.rotBoost + 0.26);
              const worldPos = NODES_DATA[a.toIdx].pos.clone().applyMatrix4(worldGroup.matrixWorld);
              burst3D(worldPos, a.colorHex, 20, 2.2);
            }
          }
        }
        a.mat.uniforms.uGrow.value = a.grow;
        a.mat.uniforms.uTime.value = elapsed;
        a.mat.uniforms.uAlpha.value = netAlpha;
      }

      nodeObjs.forEach((no) => {
        if (!no.data.active) return;
        if (no.data.pulse > 0) no.data.pulse = Math.max(0, no.data.pulse - dt * 1.5);
        const hs = (0.56 + no.data.pulse * 0.48) * (1 - app.solarBlend * 0.45);
        no.halo.scale.set(hs, hs, 1);
        no.halo.material.opacity = netAlpha;
        if (no.data.pulse > 0.02) {
          const sc = 1 + (1 - no.data.pulse) * 4.4;
          no.shock.scale.set(sc, sc, 1);
          no.shock.material.opacity = no.data.pulse * 0.82 * netAlpha;
        } else {
          no.shock.material.opacity = 0;
        }
      });

      ROLE_ORBITS.forEach((o) => {
        const unlocked = app.weave >= o.unlock - 0.04 ? Math.min(1, (app.weave - o.unlock + 0.08) / 0.14) : 0;
        const a = unlocked * netAlpha;
        o.ringMat.opacity = a * (app.sealed ? 0.34 : 0.24);
        o.sat.material.opacity = a;
        const ang = elapsed * o.speed;
        o.sat.position.set(Math.cos(ang) * o.rad, 0, Math.sin(ang) * o.rad);
      });

      breachShieldMat.opacity = app.breachFlash * 0.85;
      shockWave1.mesh.quaternion.copy(camera.quaternion);
      shockWave2.mesh.quaternion.copy(camera.quaternion);
      if (waveT1 > 0) {
        waveT1 += dt * 1.15;
        shockWave1.mat.uniforms.uProgress.value = Math.min(1, waveT1);
        shockWave1.mat.uniforms.uOpacity.value = Math.max(0, (1 - waveT1) * 0.70 * (1 - app.solarBlend));
        if (waveT1 >= 1.0) { waveT1 = 0; shockWave1.mat.uniforms.uOpacity.value = 0; }
      }
      if (waveT2 > 0) {
        waveT2 += dt * 1.05;
        shockWave2.mat.uniforms.uProgress.value = Math.min(1, waveT2);
        shockWave2.mat.uniforms.uOpacity.value = Math.max(0, (1 - waveT2) * 0.62 * (1 - app.solarBlend));
        if (waveT2 >= 1.0) { waveT2 = 0; shockWave2.mat.uniforms.uOpacity.value = 0; }
      }

      // Scale 2: Solar System
      const solarFadeGal = 1 - smoothstepJS(0.10, 0.58, app.galaxyBlend);
      const solarVis = app.solarBlend * solarFadeGal;
      solarGroup.visible = solarVis > 0.015;
      if (solarGroup.visible) {
        solarCoronaPlane.quaternion.copy(camera.quaternion);
        solarCoronaMat.uniforms.uTime.value = elapsed;
        solarCoronaMat.uniforms.uAlpha.value = solarVis * 0.86;
        asteroidMat.mat.opacity = solarVis * 0.52;
        if (!reducedMotion) asteroidMat.pts.rotation.y = elapsed * 0.028;

        const showSolarLabels = app.solarBlend > 0.52 && app.clusterBlend < 0.38;
        solarPlanets.forEach((sp) => {
          const ang = sp.cfg.a + elapsed * sp.cfg.spd;
          sp.holder.position.set(Math.cos(ang) * sp.cfg.dist, Math.sin(ang) * sp.cfg.dist * sp.cfg.incl, Math.sin(ang) * sp.cfg.dist);
          if (!reducedMotion) sp.mesh.rotation.y = elapsed * 0.32;
          sp.mat.uniforms.uTime.value = elapsed;
          sp.mat.uniforms.uAlpha.value = solarVis;
          if (sp.ringObj) sp.ringObj.mat.uniforms.uAlpha.value = solarVis;
          sp.orbitMat.opacity = solarVis * 0.22;
          positionTag(sp.tag, sp.holder.position, 22, showSolarLabels ? solarVis * (1 - app.clusterBlend * 2.5) : 0);
        });
      } else {
        solarPlanets.forEach((sp) => { sp.tag.style.opacity = "0"; });
      }

      // Scale 3: Constellation of 8 Solar Systems
      const clusterFadeGal = 1 - smoothstepJS(0.12, 0.55, app.galaxyBlend);
      const clusterVis = app.clusterBlend * clusterFadeGal;
      clusterGroup.visible = clusterVis > 0.015;
      if (clusterGroup.visible) {
        const showClusterLabels = app.clusterBlend > 0.52 && app.galaxyBlend < 0.32;
        clusterSystems.forEach((cs) => {
          cs.miniPlanets.forEach((mp) => {
            const a = mp.ph + elapsed * mp.spd;
            mp.pm.position.set(Math.cos(a) * mp.rad, Math.sin(a) * mp.rad * Math.sin(mp.tilt), Math.sin(a) * mp.rad * Math.cos(mp.tilt));
          });
          positionTag(cs.tag, cs.grp.position, 28, showClusterLabels ? clusterVis * (1 - app.galaxyBlend * 2.8) : 0);
        });
        clusterBridges.forEach((m) => { m.uniforms.uTime.value = elapsed; m.uniforms.uAlpha.value = clusterVis; });
      } else {
        clusterSystems.forEach((cs) => { cs.tag.style.opacity = "0"; });
      }

      // Scale 4: Spiral Galaxy
      galaxyGroup.visible = app.galaxyBlend > 0.015;
      if (galaxyGroup.visible) {
        galaxyUniforms.uTime.value = elapsed;
        galaxyUniforms.uAlpha.value = app.galaxyBlend;
        galaxyGroup.scale.setScalar(0.55 + 0.45 * app.galaxyBlend);
        galCoreSprite.material.opacity = app.galaxyBlend * (0.86 + Math.sin(elapsed * 2.2) * 0.08);
        deepFieldGalaxies.forEach((g, idx) => { g.material.opacity = app.galaxyBlend * (0.26 + 0.12 * Math.sin(elapsed * 0.7 + idx)); });
      }

      // 3D Spark Pool
      let anySpark = false;
      for (let i = 0; i < SPARK_MAX; i++) {
        const m = sparkMeta[i];
        if (!m.active) continue;
        anySpark = true;
        m.life += dt;
        if (m.life >= m.maxLife) { m.active = false; sparkAlpha[i] = 0; continue; }
        const drag = Math.pow(0.24, dt);
        m.vx *= drag; m.vy *= drag; m.vz *= drag;
        sparkPos[i * 3]     += m.vx * dt;
        sparkPos[i * 3 + 1] += m.vy * dt;
        sparkPos[i * 3 + 2] += m.vz * dt;
        sparkAlpha[i] = 1 - m.life / m.maxLife;
      }
      if (anySpark) {
        sparkGeo.attributes.position.needsUpdate = true;
        sparkGeo.attributes.aAlpha.needsUpdate = true;
      }

      composer.render();
      requestAnimationFrame(animate);
    }

    // Precompile EVERY shader upfront (zero runtime compile hiccups!)
    solarGroup.visible = true; clusterGroup.visible = true; galaxyGroup.visible = true;
    ALL_ARCS.forEach((a) => { a.mesh.visible = true; });
    renderer.compile(scene, camera);
    ALL_ARCS.forEach((a) => { a.mesh.visible = false; });
    solarGroup.visible = false; clusterGroup.visible = false; galaxyGroup.visible = false;

    canvas.classList.add("is-ready");
    requestAnimationFrame(animate);

    window.addEventListener("resize", () => {
      W = window.innerWidth; H = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H, false);
      composer.setPixelRatio(dpr);
      composer.setSize(W, H);
      starfieldMat.uniforms.uDpr.value = dpr;
      sparkMat.uniforms.uDpr.value = dpr;
      galaxyUniforms.uDpr.value = dpr;
    });

    /* =========================================================================
       10. UI EVENTS & KEYBOARD SHORTCUTS
       ========================================================================= */
    document.getElementById("btnNext").onclick = () => { clearAutoAll(); setStage(app.stage < 8 ? app.stage + 1 : 0); };
    document.getElementById("btnJoin").onclick = () => { clearAutoAll(); connectNextNode(); };
    document.getElementById("btnBreach").onclick = () => { clearAutoAll(); triggerBreach(); };
    document.getElementById("btnVeto").onclick = () => { clearAutoAll(); triggerVeto(); };
    document.getElementById("btnSolar").onclick = () => { clearAutoAll(); setStage(6); };
    document.getElementById("btnCluster").onclick = () => { clearAutoAll(); setStage(7); };
    document.getElementById("btnGalaxy").onclick = () => { clearAutoAll(); setStage(8); };
    document.getElementById("btnAuto").onclick = () => { if (app.autoTimer) clearAutoAll(); else toggleAuto(); };
    document.getElementById("btnQr").onclick = () => { app.qrCollapsed = !app.qrCollapsed; syncUI(); };
    document.getElementById("qrDock").onclick = () => { if (app.qrCollapsed) { app.qrCollapsed = false; syncUI(); } };
    document.getElementById("btnReset").onclick = () => { clearAutoAll(); setStage(0); };
    document.getElementById("btnHide").onclick = () => {
      app.controlsHidden = !app.controlsHidden;
      document.getElementById("stageControls").classList.toggle("hidden", app.controlsHidden);
    };
    document.getElementById("btnFull").onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    };

    const modal = document.getElementById("cfgModal");
    document.getElementById("btnCfg").onclick = () => modal.classList.add("open");
    document.getElementById("closeCfg").onclick = () => modal.classList.remove("open");
    document.getElementById("btnNoSse").onclick = () => { cfg.sseUrl = ""; saveCfg(); applyConfig(); connectSSE(""); modal.classList.remove("open"); };
    document.getElementById("btnSaveCfg").onclick = () => {
      cfg.brand = document.getElementById("inBrand").value.trim() || "SCULPTOR";
      cfg.baseUrl = document.getElementById("inBaseUrl").value.trim().replace(/\/+$/, "") || "https://team-30-platanus-hack.onrender.com";
      cfg.sseUrl = document.getElementById("inSseUrl").value.trim();
      saveCfg(); applyConfig(); connectSSE(cfg.sseUrl); modal.classList.remove("open");
    };

    document.addEventListener("keydown", (e) => {
      if (modal.classList.contains("open")) { if (e.key === "Escape") modal.classList.remove("open"); return; }
      const k = e.key.toLowerCase();
      if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); clearAutoAll(); setStage(app.stage < 8 ? app.stage + 1 : 0); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); clearAutoAll(); setStage(app.stage - 1); }
      else if (k === "j") { clearAutoAll(); connectNextNode(); }
      else if (k === "b") { clearAutoAll(); triggerBreach(); }
      else if (k === "v") { clearAutoAll(); triggerVeto(); }
      else if (k === "s") { clearAutoAll(); setStage(6); }
      else if (k === "m") { clearAutoAll(); setStage(7); }
      else if (k === "g") { clearAutoAll(); setStage(8); }
      else if (k === "a") { if (app.autoTimer) clearAutoAll(); else toggleAuto(); }
      else if (k === "q") { app.qrCollapsed = !app.qrCollapsed; syncUI(); }
      else if (k === "r") { clearAutoAll(); setStage(0); }
      else if (k === "c") modal.classList.add("open");
      else if (k === "h") { app.controlsHidden = !app.controlsHidden; document.getElementById("stageControls").classList.toggle("hidden", app.controlsHidden); }
      else if (k === "f") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
        else document.exitFullscreen?.().catch(() => {});
      }
      else if (e.key >= "0" && e.key <= "8") { clearAutoAll(); setStage(Number(e.key)); }
    });

    function snapSettledForQA() {
      const tgt = getTargetCamera(app.stage);
      camState.dist = tgt.dist; camState.elev = tgt.elev;
      app.weave = app.targetWeave;
      app.climaxBloom = app.sealed ? 1 : 0;
      app.solarBlend = app.stage >= 6 ? 1 : 0;
      app.clusterBlend = app.stage >= 7 ? 1 : 0;
      app.galaxyBlend = app.stage >= 8 ? 1 : 0;
      waveT1 = 0; waveT2 = 0;
      shockWave1.mat.uniforms.uOpacity.value = 0;
      shockWave2.mat.uniforms.uOpacity.value = 0;
      ALL_ARCS.forEach((a) => { if (a.active) { a.grow = 1; a.landed = true; a.mat.uniforms.uGrow.value = 1; } });
    }
    window.__ORBITAL__ = { setStage, connectNextNode, triggerBreach, triggerVeto, snapSettledForQA, getFps: () => measuredFps, app, cfg };

    applyConfig();
    if (cfg.sseUrl) connectSSE(cfg.sseUrl);
  </script>
</body>
</html>
