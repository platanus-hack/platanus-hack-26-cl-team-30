# Blueprint de Render: describe el servicio para crearlo desde el panel sin
# configurar cada campo a mano (New > Blueprint > elegir el repo espejo).
services:
  - type: web
    name: team-30-platanus-hack
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: medium
      # Secreto: se completa en el panel de Render, nunca en el repo.
      - key: ANTHROPIC_API_KEY
        sync: false
